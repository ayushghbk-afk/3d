name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test configuration, auth, sync and database policies
        run: npm test
      - name: Build static site
        env:
          # Optional public overrides; otherwise Vite reads .env.production.
          # Both must be provided together so URLs/keys from two projects cannot mix.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" || -n "$SUPABASE_PUBLIC_KEY" ]]; then
            : "${SUPABASE_URL:?Set VITE_SUPABASE_URL as well as the public key}"
            : "${SUPABASE_PUBLIC_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY as well as the URL}"
            export VITE_SUPABASE_URL="$SUPABASE_URL"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLIC_KEY"
          fi
          npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test the built site under /3d/ without SPA rewrites
        run: npm run test:pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
